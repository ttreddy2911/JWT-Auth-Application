version: '3.9'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./auth.db
      SECRET_KEY: local_dev_secret_key_change_me
    volumes:
      - db_data:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
