<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — AuthVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0f;
      --surface:  #111118;
      --border:   #1f1f2e;
      --accent:   #c8ff3e;
      --accent2:  #3e8fff;
      --text:     #e8e8f0;
      --muted:    #6b6b80;
      --error:    #ff4f6e;
      --success:  #3ef0a0;
      --radius:   4px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /* animated grid background */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(200,255,62,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,255,62,.04) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridDrift 20s linear infinite;
      pointer-events: none;
    }
    @keyframes gridDrift { to { background-position: 48px 48px; } }

    .glow-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      opacity: .35;
    }
    .glow-blob.a { width:400px;height:400px; background:#c8ff3e33; top:-80px; right:-80px; animation: blobA 8s ease-in-out infinite; }
    .glow-blob.b { width:300px;height:300px; background:#3e8fff22; bottom:-60px; left:-60px; animation: blobB 10s ease-in-out infinite; }
    @keyframes blobA { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,30px)} }
    @keyframes blobB { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,-20px)} }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 48px 44px 40px;
      width: min(420px, 92vw);
      animation: cardIn .6s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }

    .card::before {
      content: '';
      position: absolute; top:0; left:0; right:0; height:2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    .brand {
      font-family: 'DM Serif Display', serif;
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 32px;
      display: flex; align-items: center; gap: 8px;
    }
    .brand::before {
      content:'';
      width:20px; height:1px;
      background: var(--accent);
      display:block;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 32px;
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 8px;
    }
    h1 em { font-style: italic; color: var(--muted); }

    .subtitle {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .08em;
      margin-bottom: 36px;
    }

    .field { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      padding: 13px 16px;
      outline: none;
      border-radius: var(--radius);
      transition: border-color .2s;
    }
    input:focus { border-color: var(--accent); }
    input.error-field { border-color: var(--error); }
    input::placeholder { color: var(--muted); opacity:.5; }

    .field-error {
      font-size: 11px;
      color: var(--error);
      margin-top: 6px;
      min-height: 16px;
      display: none;
    }
    .field-error.visible { display: block; }

    .btn {
      width: 100%;
      margin-top: 28px;
      padding: 14px;
      background: var(--accent);
      color: #0a0a0f;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: opacity .2s, transform .15s;
      position: relative;
      overflow: hidden;
    }
    .btn:hover:not(:disabled) { opacity:.88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity:.45; cursor:not-allowed; }

    .btn .spinner {
      display: none;
      width: 14px; height: 14px;
      border: 2px solid #0a0a0f;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn.loading .btn-text { display: none; }
    .btn.loading .spinner { display: block; }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 12px;
      margin-top: 20px;
      display: none;
      animation: fadeIn .3s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
    .alert.error   { display:block; background: #ff4f6e14; border: 1px solid #ff4f6e44; color: var(--error); }
    .alert.success { display:block; background: #3ef0a014; border: 1px solid #3ef0a044; color: var(--success); }

    .footer-link {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
    }
    .footer-link a { color: var(--accent); text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }

    #token-display {
      display: none;
      margin-top: 16px;
      padding: 12px;
      background: #3ef0a00a;
      border: 1px solid #3ef0a033;
      border-radius: var(--radius);
      font-size: 10px;
      color: var(--success);
      word-break: break-all;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="glow-blob a"></div>
  <div class="glow-blob b"></div>

  <div class="card">
    <div class="brand">AuthVault</div>
    <h1>Welcome<br /><em>back.</em></h1>
    <p class="subtitle">Sign in to your account to continue</p>

    <div class="field">
      <label for="email">Email address</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
      <div class="field-error" id="email-err"></div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      <div class="field-error" id="password-err"></div>
    </div>

    <button class="btn" id="submit-btn" type="button">
      <span class="btn-text">Sign In</span>
      <span class="spinner"></span>
    </button>

    <div class="alert" id="alert"></div>
    <div id="token-display"></div>

    <div class="footer-link">
      No account? <a href="/register-page">Create one →</a>
    </div>
  </div>

  <script>
    const API = '';  // same origin

    const emailInput    = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailErr      = document.getElementById('email-err');
    const passwordErr   = document.getElementById('password-err');
    const alert         = document.getElementById('alert');
    const btn           = document.getElementById('submit-btn');
    const tokenDisplay  = document.getElementById('token-display');

    function setAlert(msg, type) {
      alert.className = 'alert ' + type;
      alert.textContent = msg;
    }
    function clearAlert() { alert.className = 'alert'; }

    function validateEmail(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    }

    function clearErrors() {
      [emailErr, passwordErr].forEach(el => { el.textContent=''; el.classList.remove('visible'); });
      [emailInput, passwordInput].forEach(el => el.classList.remove('error-field'));
    }

    function showFieldError(input, errEl, msg) {
      input.classList.add('error-field');
      errEl.textContent = msg;
      errEl.classList.add('visible');
    }

    function validate() {
      clearErrors(); clearAlert();
      let ok = true;
      const email = emailInput.value.trim();
      const pass  = passwordInput.value;
      if (!email) { showFieldError(emailInput, emailErr, 'Email is required'); ok=false; }
      else if (!validateEmail(email)) { showFieldError(emailInput, emailErr, 'Enter a valid email address'); ok=false; }
      if (!pass) { showFieldError(passwordInput, passwordErr, 'Password is required'); ok=false; }
      return ok;
    }

    btn.addEventListener('click', async () => {
      if (!validate()) return;
      btn.classList.add('loading'); btn.disabled = true;
      try {
        const res = await fetch(`${API}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput.value.trim(), password: passwordInput.value }),
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('jwt_token', data.access_token);
          localStorage.setItem('username', data.username);
          setAlert(`✓ Welcome back, ${data.username}! Token stored.`, 'success');
          tokenDisplay.style.display = 'block';
          tokenDisplay.textContent = `JWT: ${data.access_token.substring(0,60)}…`;
        } else {
          setAlert(data.detail || 'Login failed', 'error');
        }
      } catch(e) {
        setAlert('Network error — is the server running?', 'error');
      } finally {
        btn.classList.remove('loading'); btn.disabled = false;
      }
    });

    // Allow Enter key
    [emailInput, passwordInput].forEach(el => el.addEventListener('keydown', e => { if(e.key==='Enter') btn.click(); }));
  </script>
</body>
</html>
